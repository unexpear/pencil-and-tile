name: Release to Google Play

# Every push to main builds a signed bundle and sends it to the Play closed-testing track.
# Google reviews it, then it rolls out to testers. Pull requests only run the tests.
# A version tag (v*) builds the same signed artifacts and the github-release job attaches the APK
# to the GitHub Release. Tags do not upload to Play; the main push of that commit already did.
# Play rejects a repeated version code, so the main-branch build uses 100 + the workflow run number.
# That also appends the code to versionName. Tag builds omit it and keep the committed
# versionName (the tag) and versionCode (below 100) so the GitHub APK is the release IzzyOnDroid
# and direct download expect, in a different code range from Play.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.PENCILTILE_KEYSTORE_BASE64 != '' }}
      # String 'true' or 'false'. Signed AAB and APK artifacts are built on main and on version tags.
      # Only main is uploaded to Play; see the publish job.
      DO_RELEASE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unit tests and Android lint
        run: |
          python3 -m unittest discover -s tools/meaning -p 'test_*.py'
          python3 -m unittest discover -s tools/lexicon -p 'test_*.py'
          chmod +x gradlew
          ./gradlew --no-daemon :sudoku-engine:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease

      - name: Build signed release bundle
        if: env.DO_RELEASE == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PENCILTILE_KEYSTORE_BASE64 }}
          PENCILTILE_KEYSTORE_PASSWORD: ${{ secrets.PENCILTILE_KEYSTORE_PASSWORD }}
          PENCILTILE_KEY_ALIAS: ${{ secrets.PENCILTILE_KEY_ALIAS }}
          PENCILTILE_KEY_PASSWORD: ${{ secrets.PENCILTILE_KEY_PASSWORD }}
        run: |
          read -r COMMITTED_NAME COMMITTED_CODE <<<"$(python3 - <<'PY'
          import re, sys
          text = open("app/build.gradle.kts", encoding="utf-8").read()
          name = re.search(r'else "(\d+\.\d+\.\d+)"', text)
          code = re.search(r"versionCode = playVersionCode \?: (\d+)", text)
          if not name or not code:
              sys.exit("versionName/versionCode not found in app/build.gradle.kts")
          print(name.group(1), code.group(1))
          PY
          )"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # Unique Play code. app/build.gradle.kts turns versionName into <name>.<code>.
            CODE=$((100 + GITHUB_RUN_NUMBER))
            echo "Play version code $CODE (committed release is ${COMMITTED_NAME}/${COMMITTED_CODE})"
            VERSION_ARGS=(-PplayVersionCode="$CODE")
          else
            # Committed version, so versionName matches the tag (v1.1.3 -> 1.1.3) and the code
            # stays below Play's 100+ range.
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag ${GITHUB_REF_NAME}: versionName ${COMMITTED_NAME}, versionCode ${COMMITTED_CODE}"
            if [ "$COMMITTED_NAME" != "$TAG_VERSION" ]; then
              echo "::error title=Version name mismatch::Tag ${GITHUB_REF_NAME} does not match versionName ${COMMITTED_NAME} in app/build.gradle.kts."
              exit 1
            fi
            if [ "$COMMITTED_CODE" -ge 100 ]; then
              echo "::error title=Version code collision::Committed versionCode ${COMMITTED_CODE} overlaps Play codes (100 + workflow run number)."
              exit 1
            fi
            VERSION_ARGS=()
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export PENCILTILE_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon "${VERSION_ARGS[@]}" :app:bundleRelease :app:assembleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt -type f | sort | tail -n 1)
            if [ -z "$AAPT" ]; then
              echo "::error title=APK version not checked::aapt was not found under ANDROID_HOME, so the APK versionName could not be verified."
              exit 1
            fi
            BADGING=$("$AAPT" dump badging app/build/outputs/apk/release/app-release.apk)
            grep '^package:' <<<"$BADGING"
            if ! grep -q "versionName='${TAG_VERSION}'" <<<"$BADGING"; then
              echo "::error title=Version name mismatch::The signed APK versionName does not match tag ${GITHUB_REF_NAME}."
              exit 1
            fi
            if ! grep -q "versionCode='${COMMITTED_CODE}'" <<<"$BADGING"; then
              echo "::error title=Version code mismatch::The signed APK versionCode is not the committed code ${COMMITTED_CODE}."
              exit 1
            fi
          fi

      # Play only accepts bundles signed with the registered upload key, so check before uploading.
      - name: Check the bundle is signed with the upload key
        if: env.DO_RELEASE == 'true' && env.HAS_SIGNING_KEY == 'true'
        run: |
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | tee cert.txt
          grep -q "BE:42:70:FE:B7:74:35:DB:88:FB:32:52:49:2D:98:31:3A:79:08:B6:1B:99:85:3F:11:39:7D:A5:21:46:22:8B" cert.txt

      - name: Keep the release bundle
        if: env.DO_RELEASE == 'true' && env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # The same signed build as an APK, for the GitHub release (direct download and IzzyOnDroid).
      - name: Keep the release APK
        if: env.DO_RELEASE == 'true' && env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Explain why no bundle was built
        if: env.DO_RELEASE == 'true' && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error title=No signing key::The PENCILTILE_* signing secrets are not set, so no bundle can be built. Run 'python tools/set_release_secrets.py' once (see docs/GOOGLE_PLAY.md)."
          exit 1

  publish:
    name: Upload to Play (closed testing)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the release bundle
        if: env.HAS_PLAY_SA == 'true'
        uses: actions/download-artifact@v6
        with:
          name: app-release-aab
          path: aab

      - name: Upload to the closed testing track
        if: env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.simplegamegen.puzzles
          releaseFiles: aab/app-release.aab
          tracks: alpha
          # 'completed' goes to the closed testers as soon as Google's review passes.
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Explain why the upload was skipped
        if: env.HAS_PLAY_SA != 'true'
        run: |
          echo "::warning::Bundle built, but not uploaded: PLAY_SERVICE_ACCOUNT_JSON is not set. The signed bundle is attached to this run as 'app-release-aab'."
          echo "One-time setup: docs/GOOGLE_PLAY.md, 'Automatic releases'."

  github-release:
    name: GitHub release with the APK
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the release APK
        uses: actions/download-artifact@v6
        with:
          name: app-release-apk
          path: apk

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv apk/app-release.apk "apk/pencil-and-tile-$TAG.apk"
          gh release create "$TAG" "apk/pencil-and-tile-$TAG.apk" --title "Pencil & Tile ${TAG#v}" --notes-file distribution/whatsnew/whatsnew-en-US
