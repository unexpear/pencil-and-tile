[versions]
gradle = "8.11.1"
agp = "8.10.1"
# SceneView 4.18.0 is built with Kotlin 2.3.21. 4.19+ needs Kotlin 2.4, and no KSP
# release supports 2.4 yet (Room is processed with KSP). 2.3.20 matches KSP 2.3.11,
# the last 2.3 KSP that still accepts AGP 8.10 (2.3.12 requires AGP 8.12).
# SceneView 4.18 is compiled against Compose BOM 2026.05.01. Its composables call
# Composer.shouldExecute and ComposablesKt.getCurrentCompositeKeyHashCode, which
# Compose 1.7 (BOM 2024.09.00) does not have. Opening Knife Flip was the first
# call into those composables, so the screen crashed before a frame. Keep this BOM.
kotlin = "2.3.20"
ksp = "2.3.11"
composeBom = "2026.05.01"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
navigationCompose = "2.7.7"
room = "2.7.0"
datastore = "1.1.1"
junitJupiter = "5.11.0"
coroutines = "1.8.1"
junitPlatform = "1.11.0"
onnxruntime = "1.22.0"
sqliteJdbc = "3.47.1.0"
# Newest io.github.sceneview:sceneview that stays on Kotlin 2.3 (see kotlin note above).
# Filament 1.71.5 comes in with it. minSdk of the library is 24; the app is 26.
sceneview = "4.18.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
sceneview = { group = "io.github.sceneview", name = "sceneview", version.ref = "sceneview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
